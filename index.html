<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <h1>🛒 Shopping List</h1>

        <div class="new-list">
            <input
                id="listName"
                type="text"
                placeholder="New list name"
            >

            <button onclick="createList()">
                Create List
            </button>
        </div>

        <div id="lists"></div>

        <hr>

        <h2 id="currentListName">My List</h2>

        <div class="add-item">
            <input
                id="itemInput"
                type="text"
                placeholder="Add an item..."
            >

            <button onclick="addItem()">
                Add
            </button>
        </div>

        <ul id="items"></ul>

    </div>

    <script src="script.js"></script>

</body>
</html>
